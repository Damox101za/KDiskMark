name: Main
on:
  push:
    branches-ignore:
      - 'releases/**'
    paths-ignore:
    - '**.md'
    - '.github/workflows/release.yml'
    - '.gitignore'
    - 'data/translations/**'
  pull_request:
    paths-ignore:
    - '**.md'
    - '.github/workflows/release.yml'
    - '.gitignore'
    - 'data/translations/**'
jobs:
  Main:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        include:
          - os: ubuntu-22.04
            CXXFLAGS: '-Wall -Wextra -pedantic -Werror'
    steps:
    - name: Clone repo
      uses: actions/checkout@v2.2.0
      with:
        submodules: recursive

    - name: Install dependent apt packages
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install qttools5-dev libpolkit-qt5-1-dev extra-cmake-modules fio

    - name: Build
      run: |
        mkdir build
        cd build
        cmake -DUSE_QT5=ON -DBUILD_TESTS=ON ..
        cmake --build . --parallel 2

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

  Windows:
    runs-on: windows-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        cache: true

    - name: Get fio (official Windows build)
      shell: pwsh
      run: |
        $version = '3.43'
        Invoke-WebRequest "https://github.com/axboe/fio/releases/download/fio-$version/fio-$version-x64.msi" -OutFile fio.msi
        # an administrative install only extracts the files
        Start-Process msiexec.exe -Wait -ArgumentList '/a', 'fio.msi', '/qn', "TARGETDIR=$PWD\fio-extracted"
        $exe = Get-ChildItem fio-extracted -Recurse -Filter fio.exe | Select-Object -First 1
        New-Item -ItemType Directory third-party\fio -Force | Out-Null
        Copy-Item "$($exe.DirectoryName)\*" third-party\fio -Recurse
        Get-ChildItem third-party\fio | Select-Object Name, Length

    - name: Build
      run: |
        cmake -S . -B build -DBUILD_TESTS=ON
        cmake --build build --config Release --parallel 2

    - name: Test
      shell: pwsh
      run: |
        $env:PATH = "$PWD\third-party\fio;$env:PATH"
        # the test that runs the real fio, verbosely and into a file, so a failure explains itself
        & build\tests\Release\tst_localbackend.exe -v2 -o localbackend.log,txt
        "exit code of tst_localbackend: $LASTEXITCODE"
        if (Test-Path localbackend.log) { Get-Content localbackend.log } else { "no log file was written" }
        ctest --test-dir build -C Release --output-on-failure

    - name: Package
      shell: pwsh
      run: |
        cmake --install build --config Release --prefix dist
        windeployqt --release dist\kdiskmark.exe
        Get-ChildItem dist | Select-Object Name

    - name: Upload the Windows build
      uses: actions/upload-artifact@v4
      with:
        name: kdiskmark-windows
        path: dist
