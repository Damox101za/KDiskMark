name: Main
on:
  push:
    branches-ignore:
      - 'releases/**'
    paths-ignore:
    - '**.md'
    - '.github/workflows/release.yml'
    - '.gitignore'
    - 'data/translations/**'
  pull_request:
    paths-ignore:
    - '**.md'
    - '.github/workflows/release.yml'
    - '.gitignore'
    - 'data/translations/**'
jobs:
  Main:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        include:
          - os: ubuntu-22.04
            CXXFLAGS: '-Wall -Wextra -pedantic -Werror'
    steps:
    - name: Clone repo
      uses: actions/checkout@v2.2.0
      with:
        submodules: recursive

    - name: Install dependent apt packages
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install qttools5-dev libpolkit-qt5-1-dev extra-cmake-modules fio

    - name: Build
      run: |
        mkdir build
        cd build
        cmake -DUSE_QT5=ON -DBUILD_TESTS=ON ..
        cmake --build . --parallel 2

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

  Windows:
    runs-on: windows-latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        cache: true

    - name: Get fio (official Windows build)
      shell: pwsh
      run: |
        $version = '3.43'
        Invoke-WebRequest "https://github.com/axboe/fio/releases/download/fio-$version/fio-$version-x64.msi" -OutFile fio.msi
        # an administrative install only extracts the files
        Start-Process msiexec.exe -Wait -ArgumentList '/a', 'fio.msi', '/qn', "TARGETDIR=$PWD\fio-extracted"
        $exe = Get-ChildItem fio-extracted -Recurse -Filter fio.exe | Select-Object -First 1
        New-Item -ItemType Directory third-party\fio -Force | Out-Null
        Copy-Item "$($exe.DirectoryName)\*" third-party\fio -Recurse
        Get-ChildItem third-party\fio | Select-Object Name, Length

    - name: Build
      run: |
        cmake -S . -B build -DBUILD_TESTS=ON
        cmake --build build --config Release --parallel 2

    - name: Test
      shell: pwsh
      run: |
        $env:PATH = "$PWD\third-party\fio;$env:PATH"
        # the test that runs the real fio, verbosely and into a file, so a failure explains itself
        & build\tests\Release\tst_localbackend.exe -v2 -o localbackend.log,txt
        "exit code of tst_localbackend: $LASTEXITCODE"
        if (Test-Path localbackend.log) { Get-Content localbackend.log } else { "no log file was written" }
        ctest --test-dir build -C Release --output-on-failure

    - name: Package
      shell: pwsh
      run: |
        cmake --install build --config Release --prefix dist
        windeployqt --release dist\kdiskmark.exe
        Get-ChildItem dist | Select-Object Name

    - name: Upload the Windows build
      uses: actions/upload-artifact@v4
      with:
        name: kdiskmark-windows
        path: dist

  FioProbe:
    # Temporary: finds out which way of calling fio works on Windows
    runs-on: windows-latest
    steps:
    - name: Probe fio.exe
      shell: pwsh
      run: |
        $version = '3.43'
        Invoke-WebRequest "https://github.com/axboe/fio/releases/download/fio-$version/fio-$version-x64.msi" -OutFile fio.msi
        Start-Process msiexec.exe -Wait -ArgumentList '/a', 'fio.msi', '/qn', "TARGETDIR=$PWD\x"
        $fio = (Get-ChildItem x -Recurse -Filter fio.exe | Select-Object -First 1).FullName
        & $fio --version
        $base = Join-Path $env:RUNNER_TEMP 'fioprobe'
        New-Item -ItemType Directory $base -Force | Out-Null

        function Esc($p) { return ($p -replace ':', '\:') }

        function Fio($label, [string[]]$a) {
          $out = & $fio @a 2>&1 | Out-String
          $code = $LASTEXITCODE
          $json = $null
          $i = $out.IndexOf("`n{")
          if ($out.StartsWith('{')) { $i = -1 }
          try {
            $text = if ($out.StartsWith('{')) { $out } elseif ($i -ge 0) { $out.Substring($i + 1) } else { '' }
            $json = $text | ConvertFrom-Json
          } catch { }
          $summary = if ($json) { "error=$($json.jobs[0].error) read_bw_bytes=$($json.jobs[0].read.bw_bytes) write_bw_bytes=$($json.jobs[0].write.bw_bytes)" } else { 'no JSON' }
          $err = ($out -split "`n" | Where-Object { $_ -match 'fio:|err=|error' -and $_ -notmatch '^\s*"' } | Select-Object -First 3) -join ' | '
          "[$label] exit=$code $summary $err"
        }

        function Case($name, $prepare, $extra, $sleep) {
          $f = Join-Path $base "$name.tmp"
          if (Test-Path $f) { Remove-Item $f -Force }
          New-Item $f -ItemType File | Out-Null          # what QTemporaryFile leaves behind
          $e = Esc $f
          if ($prepare) {
            Fio "$name prepare" @('--output-format=json', '--thread', '--create_only=1', "--filename=$e", '--size=16m', '--zero_buffers=0', '--name=prepare')
            "   size after prepare: $((Get-Item $f).Length)"
          }
          if ($sleep) { Start-Sleep -Seconds $sleep }
          $args = @('--output-format=json', '--thread', '--randrepeat=0', '--end_fsync=1', '--direct=0', '--rwmixread=70', "--filename=$e", '--name=randread', '--size=16m', '--zero_buffers=0', '--bs=4k', '--runtime=1', '--rw=randread', '--iodepth=1', '--numjobs=1', '--group_reporting') + $extra
          Fio "$name run $($extra -join ' ')" $args
          "   size after run: $((Get-Item $f).Length)"
        }

        '=== A: prepare then run, windowsaio (what the app does now)'
        Case 'A' $true @('--ioengine=windowsaio') 0
        '=== B: same, no ioengine option'
        Case 'B' $true @() 0
        '=== C: same as A with --allow_file_create=0'
        Case 'C' $true @('--ioengine=windowsaio', '--allow_file_create=0') 0
        '=== D: no prepare, fio creates the file in the run'
        Case 'D' $false @('--ioengine=windowsaio') 0
        '=== E: same as A with 5 s between prepare and run'
        Case 'E' $true @('--ioengine=windowsaio') 5
        '=== F: prepare, then run as a write test'
        $f = Join-Path $base 'F.tmp'; New-Item $f -ItemType File -Force | Out-Null; $e = Esc $f
        Fio 'F prepare' @('--output-format=json', '--thread', '--create_only=1', "--filename=$e", '--size=16m', '--name=prepare')
        Fio 'F run randwrite' @('--output-format=json', '--thread', '--ioengine=windowsaio', '--direct=0', "--filename=$e", '--name=randwrite', '--size=16m', '--bs=4k', '--runtime=1', '--rw=randwrite', '--iodepth=1', '--numjobs=1', '--group_reporting')
        '=== G: directly in the drive root of the runner temp, no escape needed? (unescaped colon)'
        $f = Join-Path $base 'G.tmp'; New-Item $f -ItemType File -Force | Out-Null
        Fio 'G prepare unescaped' @('--output-format=json', '--thread', '--create_only=1', "--filename=$f", '--size=16m', '--name=prepare')
